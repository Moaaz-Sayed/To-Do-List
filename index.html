<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Google Font-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap"
        rel="stylesheet">
    <!--Font Awesome Library for Icons-->
    <link rel="stylesheet" href="./css/all.min.css">
    <!--Main Css File-->
    <link rel="stylesheet" href="./css/main.css">
    <title>قائمة المهام</title>
</head>

<body>
    <!--Start container div-->
    <div class="container">
        <!--start tasks table-->
        <div class="table">
            <header>
                <h1>مهـــامي</h1>
                <button class="add circle" id="add"><span><i class="fa-solid fa-plus"></span></i></button>
            </header>

            <!--start input-->
            <div class="form" id="form">
                <input type="text" class="txt" id="input">
                <button class="creat" id="submit">إضافة</button>
                <i class="fa-solid fa-circle-xmark cancel"></i>
            </div>
            <div class="edit-text" id="editForm">
                <input type="text" class="txt" id="editInput">
                <button class="creat" id="editButton">تعديل</button>
                <i class="fa-solid fa-circle-xmark cancel cancel-e"></i>

            </div>
            <!--End input-->
            <!--start tasks-->
            <div class="all-tasks"></div>
            <!--End tasks-->
        </div>
        <!--End tasks table-->
    </div>
    <!--End container div-->
    <script src="./js/app.js"></script>
</body>

</html>
